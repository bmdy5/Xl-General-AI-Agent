# 9. 记忆库物理沙箱化与跨平台解耦 (Sandbox Memory & Dynamic Caching)
memory:
  base_dir: "~/.my-agent/memory"                # 记忆数据库在 Home 目录的主物理温床
  backup_dir: "./agent_memory/core"             # 项目相对的自封包备份温床，实现 0ms 一键换家
  auto_backup_to_project: true                  # 强力开启动态异步热双写备份
  multi_instance_isolation: true               # 强力开启基于 admin_id 的多开实例哈希隔离

knowledge_base:
  notes_paths:                                  # 增量学习笔记路径列表，支持 ~ 动态解析
    - "~/Documents/学习笔记"
  kb_dir: "~/Documents/学习笔记"

# 10. 敏感操作会话级全局绿灯超时时间 (Session Permission Timeout)
SESSION_PERMISSION_TIMEOUT: 1800               # 默认为 30 分钟（1800 秒），亮哥授权一次后在此时间段内全部自动放行并动态顺延

# 11. 系统阈值配置 (System Thresholds)
thresholds:
  skill_relevance_low: 2.5           # 技能召回最低相关度分数
  skill_relevance_high: 5.0          # 高相关度技能分类边界
  skill_prompt_max_chars: 2500       # 注入 Prompt 的技能内容最大字符数
  skill_promotion_usage: 5           # 经验晋升技能所需最低使用次数
  skill_promotion_success_rate: 0.90 # 经验晋升技能所需最低成功率
  experience_recall_top_k: 2         # 动态经验召回数量
  experience_prompt_max_chars: 2000  # 注入 Prompt 的经验内容最大字符数
  tts_idle_timeout_seconds: 7200     # TTS 闲置超时强杀秒数 (2h)
  tts_health_timeout: 3.0            # TTS 健康探测超时秒数
  tts_health_fail_threshold: 3       # TTS 自愈前连续失败次数
  dream_cosine_merge: 0.90           # KI 合并余弦相似度阈值
  dream_cosine_damping: 0.75         # KI 阻尼裁判余弦相似度下限
  dream_trigger_tokens: 64000        # 触发做梦的 token 阈值
  fatigue_decay_rate: 2.0            # 疲劳衰减率
  cluster_similarity: 0.82           # Macro 聚类余弦相似度阈值

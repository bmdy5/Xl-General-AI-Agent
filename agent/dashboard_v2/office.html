<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pixel Office</title>
<style>
body{margin:0;background:#1a1010;display:flex;justify-content:center;align-items:center;height:100vh}
canvas{image-rendering:pixelated}
</style></head><body>
<canvas id="c" width="960" height="640"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const W=960,H=640;

const CLR={
  bg:'#0f0f0f', wallW:'#3a2717', wallHi:'#5a3a20',
  doorF:'#8B5E3C', doorO:'#1a1010',
  flComp:'#4A4A4A', flLib:'#7f5034', flXL:'#7f5034',
  flStor:'#615988', flMeet:'#8C4A2F', flHall:'#9A7B4F',
  flMimo:'#5a4a7a', flRecep:'#7f5034',
  desk:'#c4a060', scrn:'#5b9bd5', chair:'#b89850',
  plant:'#2a6b2a', plant2:'#3a8a3a', pot:'#8b4513',
  table:'#a08050', tableD:'#805030',
  divd:'#a0a0a0', wb:'#4A90E2',
  board:'#d4c8a0', txt:'#f0e8d0', tDark:'#3a2010',
  skin:'#f4c8a0', gold:'#f4d058', red:'#e04b4b',
  blue:'#4ba4e0', green:'#4be05a', purp:'#a04be0', gray:'#8b8b9b',
  shelf:'#8b6914', sofa:'#d4a060', sofaD:'#c08040',
  cab:'#8b4513', win:'#87ceeb', light:'#f4d058',
  carpet:'rgba(139,69,19,0.3)',
};

const ROOMS=[
  {x:0,y:0,w:264,h:276,n:'电脑房',f:CLR.flComp},
  {x:274,y:0,w:268,h:276,n:'图书室',f:CLR.flLib},
  {x:552,y:0,w:196,h:276,n:'XL办公室',f:CLR.flXL},
  {x:758,y:0,w:202,h:276,n:'Mimo视觉',f:CLR.flMimo},
  {x:0,y:360,w:264,h:120,n:'前台',f:CLR.flRecep},
  {x:274,y:360,w:686,h:110,n:'会议室',f:CLR.flMeet},
  {x:0,y:484,w:264,h:156,n:'储物室',f:CLR.flStor},
];

function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}
function pset(x,y,c){X.fillStyle=c;X.fillRect(x,y,1,1)}

function drawRoom(r){
  // Wall shadow (outer)
  rect(r.x-5,r.y-5,r.w+10,r.h+10,CLR.wallW);
  // Wall top highlight (inner)
  rect(r.x-3,r.y-3,r.w+6,3,CLR.wallHi);
  // Floor
  rect(r.x,r.y,r.w,r.h,r.f);
  // Floor grain
  X.fillStyle='rgba(0,0,0,0.08)';
  for(let y=r.y+12;y<r.y+r.h;y+=24)X.fillRect(r.x,y,r.w,1);
  X.fillStyle='rgba(255,255,255,0.03)';
  for(let y=r.y+13;y<r.y+r.h;y+=24)X.fillRect(r.x,y,r.w,1);
  // Base shadow at bottom
  rect(r.x,r.y+r.h-6,r.w,6,'rgba(0,0,0,0.2)');
  // Label
  X.fillStyle='rgba(0,0,0,0.45)';X.font='9px monospace';X.fillText(r.n,r.x+6,r.y+14);
  X.fillStyle=CLR.txt;X.fillText(r.n,r.x+5,r.y+13);
}

function drawCorridor(){
  const y=280, h=76;
  rect(0,y,W,h,CLR.flHall);
  // Wood grain
  X.fillStyle='rgba(0,0,0,0.06)';
  for(let yy=y;yy<y+h;yy+=12)X.fillRect(0,yy,W,1);
  X.fillStyle='rgba(255,255,255,0.04)';
  for(let yy=y+1;yy<y+h;yy+=12)X.fillRect(0,yy,W,1);
  // Label
  X.fillStyle='rgba(0,0,0,0.45)';X.font='9px monospace';X.fillText('走廊',8,y+16);
  X.fillStyle=CLR.txt;X.fillText('走廊',7,y+15);
  // Items
  rect(860,y+12,14,44,CLR.wb); rect(862,y+10,10,6,'#fff'); // water
  rect(620,y+4,44,32,CLR.board); rect(624,y+10,8,6,CLR.red); // board
  rect(380,y+16,90,44,CLR.carpet); rect(384,y+20,82,36,'rgba(139,69,19,0.15)'); // carpet
}

function drawDoorway(x, topY, botY){
  rect(x-10,topY-4,20,botY-topY+8,CLR.doorO);
  rect(x-12,topY-6,24,4,CLR.doorF);
  rect(x-12,botY+2,24,4,CLR.doorF);
  rect(x-12,topY-4,4,botY-topY+8,CLR.doorF);
  rect(x+8,topY-4,4,botY-topY+8,CLR.doorF);
}

function drawFurniture(){
  // ── Computer Room ──
  const cr=ROOMS[0];
  [[36,36],[148,36],[36,160],[148,160]].forEach(([dx,dy])=>{
    const x=cr.x+dx,y=cr.y+dy;
    rect(x,y,40,16,CLR.desk);rect(x+28,y-12,10,12,CLR.scrn);rect(x+12,y+16,8,8,CLR.chair);
  });
  rect(cr.x+133,cr.y+16,2,256,CLR.divd);
  rect(cr.x+16,cr.y+140,228,2,CLR.divd);
  // Pot plants x4
  [14,114,220].forEach(dx=>{[240,255].forEach(yd=>{
    rect(cr.x+dx,cr.y+yd,10,12,CLR.pot);rect(cr.x+dx,cr.y+yd-10,10,10,CLR.plant);
  })});
  // Painting
  rect(cr.x+100,cr.y+6,24,18,CLR.doorF);
  rect(cr.x+103,cr.y+9,8,6,CLR.plant2);rect(cr.x+113,cr.y+10,6,6,'#87ceeb');

  // ── Library ──
  const lib=ROOMS[1];
  for(let row=0;row<3;row++){
    rect(lib.x+12,lib.y+16+row*58,26,50,CLR.shelf);
    for(let r2=0;r2<4;r2++)rect(lib.x+14,lib.y+20+row*58+r2*12,22,8,r2%2?CLR.red:CLR.blue);
  }
  // Sofa + table
  rect(lib.x+110,lib.y+160,52,16,CLR.sofa);rect(lib.x+110,lib.y+176,52,14,CLR.sofaD);
  rect(lib.x+120,lib.y+194,28,12,'#a07040');
  // Plant
  rect(lib.x+210,lib.y+230,10,14,CLR.pot);rect(lib.x+210,lib.y+220,10,10,CLR.plant);
  // Window
  rect(lib.x+180,lib.y+20,20,22,CLR.win);rect(lib.x+178,lib.y+18,24,4,CLR.doorF);

  // ── XL Office ──
  const xl=ROOMS[2];
  rect(xl.x+30,xl.y+60,100,30,CLR.desk);
  rect(xl.x+50,xl.y+38,10,16,CLR.scrn);rect(xl.x+70,xl.y+38,10,16,CLR.scrn);
  rect(xl.x+65,xl.y+90,12,12,CLR.red); // chair
  rect(xl.x+150,xl.y+30,22,50,CLR.cab); // cabinet
  rect(xl.x+10,xl.y+180,14,18,CLR.win);
  rect(xl.x+10,xl.y+16,14,14,'#d4c8a0'); // clock
  rect(xl.x+14,xl.y+22,2,6,CLR.tDark);rect(xl.x+14,xl.y+20,6,2,CLR.tDark);
  // Plant
  rect(xl.x+160,xl.y+230,10,14,CLR.pot);rect(xl.x+160,xl.y+220,10,10,CLR.plant);

  // ── Mimo Visual Room ──
  const mv=ROOMS[3];
  rect(mv.x+30,mv.y+50,50,22,CLR.desk);
  rect(mv.x+64,mv.y+30,16,18,CLR.scrn); // big monitor
  rect(mv.x+66,mv.y+32,12,10,CLR.scrn);
  rect(mv.x+40,mv.y+72,10,10,CLR.chair);
  // Server rack
  rect(mv.x+130,mv.y+40,26,70,CLR.shelf);
  for(let i=0;i<5;i++)rect(mv.x+132,mv.y+44+i*14,22,10,i%2?CLR.green:CLR.blue);
  // "Vision" label
  X.fillStyle=CLR.txt;X.font='7px monospace';X.fillText('Vision',mv.x+50,mv.y+130);
  // Plants
  rect(mv.x+10,mv.y+230,10,14,CLR.pot);rect(mv.x+10,mv.y+220,10,10,CLR.plant);

  // ── Reception ──
  const rc=ROOMS[4];
  rect(rc.x+20,rc.y+30,60,22,CLR.desk);
  rect(rc.x+36,rc.y+52,8,8,CLR.chair);
  rect(rc.x+140,rc.y+14,30,50,CLR.shelf);
  rect(rc.x+180,rc.y+30,40,20,CLR.sofa);
  // Painting
  rect(rc.x+100,rc.y+10,22,16,CLR.doorF);rect(rc.x+104,rc.y+16,6,4,CLR.plant2);

  // ── Meeting Room ──
  const mt=ROOMS[5];
  // Table: ellipse
  X.fillStyle=CLR.table;X.beginPath();X.ellipse(mt.x+340,mt.y+50,120,30,0,0,Math.PI*2);X.fill();
  X.fillStyle=CLR.tableD;X.beginPath();X.ellipse(mt.x+340,mt.y+50,112,24,0,0,Math.PI*2);X.fill();
  // 6 chairs
  [-0.7,-0.2,0.3,1.8,2.3,2.8].forEach(a=>{
    const cx=mt.x+340+Math.cos(a)*100,cy=mt.y+50+Math.sin(a)*35;
    rect(cx-5,cy-5,10,10,CLR.chair);
  });
  // Whiteboard
  rect(mt.x+12,mt.y+30,50,36,'#f8f8f8');rect(mt.x+10,mt.y+28,54,4,CLR.doorF);
  // Projector
  rect(mt.x+200,mt.y+4,80,4,'#f0f0f0');
  // Light
  rect(mt.x+330,mt.y-4,16,6,CLR.light);

  // ── Storage ──
  const st=ROOMS[6];
  rect(st.x+14,st.y+14,36,40,CLR.shelf);
  rect(st.x+80,st.y+18,28,22,'#a08050');
  rect(st.x+130,st.y+18,28,22,'#a08050');
  rect(st.x+180,st.y+50,22,30,'#a08050');
}

function drawAgents(){
  const bob=Date.now()*0.004;
  function agent(x,y,c,l){
    const b=Math.sin(bob+(l||'x').charCodeAt(0))*1;
    rect(x-4,y+b,8,12,c);rect(x-3,y-8+b,6,8,CLR.skin);
    rect(x-2,y-6+b,2,2,'#1a1010');rect(x+1,y-6+b,2,2,'#1a1010');
    X.fillStyle=CLR.txt;X.font='6px monospace';X.fillText(l,x-l.length*2-1,y-12+b);
  }
  agent(ROOMS[2].x+100,ROOMS[2].y+200,CLR.gold,'XL');
  agent(ROOMS[0].x+50,ROOMS[0].y+120,CLR.blue,'L1');
  agent(ROOMS[0].x+160,ROOMS[0].y+120,CLR.blue,'L2');
  agent(ROOMS[3].x+50,ROOMS[3].y+120,CLR.purp,'Mimo');
  agent(ROOMS[5].x+200,ROOMS[5].y+80,CLR.red,'D-A');
  agent(ROOMS[5].x+350,ROOMS[5].y+80,CLR.green,'D-B');
  agent(ROOMS[5].x+500,ROOMS[5].y+70,CLR.gray,'Rev');
}

function render(){
  rect(0,0,W,H,CLR.bg);
  ROOMS.forEach(r=>drawRoom(r));
  drawCorridor();
  // Doorways: top rooms → corridor
  drawDoorway(140,268,280);
  drawDoorway(400,268,280);
  drawDoorway(640,268,280);
  drawDoorway(850,268,280);
  // corridor → bottom rooms
  drawDoorway(140,356,368);
  drawDoorway(480,356,368);
  drawFurniture();
  drawAgents();
  requestAnimationFrame(render);
}
render();
</script></body></html>
